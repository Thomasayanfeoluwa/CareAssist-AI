services:
  - type: redis
    name: careassist-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: careassist-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: carebot
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PILOT_AUTH_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://careassist-web.onrender.com
      - key: REDIS_URL
        fromService:
          type: redis
          name: careassist-redis
          property: connectionString
      - key: LITELLM_PRIMARY_MODEL
        value: groq/llama-3.3-70b-versatile
      - key: LITELLM_FALLBACK_MODEL
        value: openrouter/meta-llama/llama-3.3-70b-instruct
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: careassist-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://careassist-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html